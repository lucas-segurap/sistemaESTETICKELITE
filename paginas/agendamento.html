<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <!-- TAG DO MEU SITE-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Página com conteúdos, exercícios e atividades desenvolvidas durante as aulas de Bootstrap, aprendendo a criar páginas web modernas, organizadas e responsivas.">
    <meta name="keywords" content="sites,web desenvolvimento backend">
    <meta name="author" content="Lucas segura, SeguraPrime, seguralucas949@gmail.com, 11 97387-4201">
    <title>Agendamento</title>
    <link rel="icon" href="/favicon_io/android-chrome-192x192.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>






    <style>
        body {
            background-color: #080808;
            color: white;
        }

        .agendamento {
            max-width: 750px;
            margin: 60px auto;
            background-color: #111111;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #292929;
        }

        .agendamento h1 {
            color: #d4af37;
            font-weight: bold;
        }

        .form-label {
            color: #dddddd;
        }

        .form-control,
        .form-select {
            background-color: #1c1c1c;
            border: 1px solid #333333;
            color: white;
        }

        .form-control:focus,
        .form-select:focus {
            background-color: #1c1c1c;
            color: white;
            border-color: #d4af37;
            box-shadow: none;
        }

        .form-select option {
            background-color: #111111;
            color: white;
        }

        .btn-estetick {
            background-color: #d4af37;
            border-color: #d4af37;
            color: #080808;
            font-weight: bold;
        }

        .btn-estetick:hover {
            background-color: white;
            border-color: white;
            color: #080808;
        }
    </style>





    <div class="container">
        <div id="header-container"></div>
    </div>

    <main class="container">

        <div class="agendamento">

            <div class="text-center mb-4">

                <h1>Agendamento</h1>

                <p style="color: #cccccc;">
                    Escolha o serviço, a data e o horário desejado.
                </p>

            </div>

            <form>

                <div class="mb-3">

                    <label class="form-label">
                        Nome completo
                    </label>

                    <input type="text" class="form-control" placeholder="Digite seu nome" required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Veículo
                    </label>

                    <input type="text" class="form-control" placeholder="Ex.: Honda Civic" required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Serviço
                    </label>

                    <select class="form-select" required>

                        <option value="">
                            Selecione um serviço
                        </option>

                        <option>
                            Lavagem técnica — R$ 80,00
                        </option>

                        <option>
                            Enceramento Wax — R$ 250,00
                        </option>

                        <option>
                            Revitalização de plásticos — R$ 480,00
                        </option>

                        <option>
                            Polimento de Pintura — R$ 700,00
                        </option>

                        <option>
                            Revitalização de Plásticos Internos — R$ 380,00
                        </option>

                        <option>
                            Vitrificação de Vidros — R$ 600,00
                        </option>

                        <option>
                            Descontaminação de Pintura — R$ 580,00
                        </option>

                        <option>
                            Polimento de Faróis — R$ 150,00
                        </option>

                        <option>
                            Combo Start — R$ 300,00
                        </option>

                        <option>
                            Combo Premium — R$ 750,00
                        </option>

                        <option>
                            Combo Elite — R$ 1.300,00
                        </option>

                    </select>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Data
                        </label>

                        <input type="date" class="form-control" required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Horário
                        </label>

                        <input type="time" class="form-control" required>

                    </div>

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Observações
                    </label>

                    <textarea class="form-control" rows="4" placeholder="Alguma observação sobre o veículo?"></textarea>

                </div>

                <button type="submit" class="btn btn-estetick w-100">
                    Confirmar agendamento
                </button>

            </form>

        </div>

    </main>




    <div>
        <div id="footer-container"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>
    <script src="/js/script.js"></script>

</body>

</html>
